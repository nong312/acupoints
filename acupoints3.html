        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05070c);
            scene.fog = new THREE.FogExp2(0x05070c, 0.035);

        // --- 加载 Anatomy Model.glb ---
function loadGlbModel() {
    humanModelGroup = new THREE.Group();
    meridianLinesGroup = new THREE.Group();

    const loader = new THREE.GLTFLoader();
    
    loader.load('Anatomy Model.glb', (gltf) => {
        loadedGlbModel = gltf.scene;

        // ==========================================
        // 🔥 【核心大招】直接把模型整体放大 100 倍（如果还小，可改成 200 或 500）
        // ==========================================
        const scaleFactor = 10; 
        loadedGlbModel.scale.set(scaleFactor, scaleFactor, scaleFactor);

        // 1. 获取放大后的包围盒与中心点，并让它精准居中到原点 (0,0,0)
        const box = new THREE.Box3().setFromObject(loadedGlbModel);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);

        loadedGlbModel.position.x -= center.x;
        loadedGlbModel.position.y -= center.y;
        loadedGlbModel.position.z -= center.z;

        // 2. 将旋转中心锁定在原点
        if (typeof controls !== 'undefined') {
            controls.target.set(0, 0, 0);
        }

        // 3. 自动调整相机，让镜头保持完美视距
        if (typeof camera !== 'undefined') {
            const distance = maxDim * 1.5; 
            
            // 相机正对原点，高度微微抬高对准上半身
            camera.position.set(0, size.y * 0.05, distance);
            
            camera.near = maxDim * 0.001;
            camera.far = maxDim * 100;
            camera.updateProjectionMatrix();
            
            if (typeof controls !== 'undefined') {
                controls.update();
            }
            
            console.log("【强制放大完成】缩放倍数:", scaleFactor, "当前模型高度:", size.y);
        }

        humanModelGroup.add(loadedGlbModel);
        scene.add(humanModelGroup);

        // 生成穴位（此时它们会和放大后的模型完美重合！）
        createAcupointMarkersAndLines();

        const loaderEl = document.getElementById('loading-overlay');
        if(loaderEl) {
            loaderEl.style.opacity = '0';
            setTimeout(() => loaderEl.remove(), 500);
        }
    }, undefined, (error) => {
        console.error('加载 Anatomy Model.glb 失败:', error);
        const loaderEl = document.getElementById('loading-overlay');
        if(loaderEl) {
            loaderEl.innerHTML = `
                <div class="text-center p-6 max-w-md">
                    <i class="fa-solid fa-triangle-exclamation text-amber-400 text-3xl mb-3"></i>
                    <h2 class="font-serif text-base font-bold text-slate-200">无法加载 Anatomy Model.glb</h2>
                    <p class="text-xs text-slate-400 mt-2">请确认文件已放在网页同级目录下，并且文件名正确无误。</p>
                </div>
            `;
        }
        scene.add(humanModelGroup);
        createAcupointMarkersAndLines();
    });
}

        function createAcupointMarkersAndLines() {
            const sphereGeo = new THREE.SphereGeometry(0.045, 32, 32);

            acupointsData.forEach(point => {
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x10b981,
                    emissive: 0x059669,
                    emissiveIntensity: 0.85,
                    roughness: 0.15
                });

                const mesh = new THREE.Mesh(sphereGeo, mat);
                mesh.position.set(point.position.x, point.position.y, point.position.z);
                mesh.userData = { pointId: point.id, pointData: point };

                scene.add(mesh);
                acupointMeshes.push(mesh);
            });

            const lineMat = new THREE.LineBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.45, linewidth: 2 });
            const pointsList = [new THREE.Vector3(0.92, -0.25, 0.35), new THREE.Vector3(1.05, 0.35, 0.12)];
            const geometry = new THREE.BufferGeometry().setFromPoints(pointsList);
            meridianLinesGroup.add(new THREE.Line(geometry, lineMat));

            scene.add(meridianLinesGroup);
        }

        function setAnatomyLayer(layer) {
            const btnAll = document.getElementById('layer-all-btn');
            const btnMuscle = document.getElementById('layer-muscle-btn');
            const btnSkeleton = document.getElementById('layer-skeleton-btn');

            btnAll.className = 'px-3 py-1.5 rounded-lg text-slate-300 hover:text-white transition';
            btnMuscle.className = 'px-3 py-1.5 rounded-lg text-slate-300 hover:text-white transition';
            btnSkeleton.className = 'px-3 py-1.5 rounded-lg text-slate-300 hover:text-white transition';

            if (layer === 'all') btnAll.className = 'px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-medium transition';
            if (layer === 'muscle') btnMuscle.className = 'px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-medium transition';
            if (layer === 'skeleton') btnSkeleton.className = 'px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-medium transition';

            if (loadedGlbModel) {
                loadedGlbModel.traverse(child => {
                    if (child.isMesh) {
                        const name = child.name.toLowerCase();
                        if (layer === 'all') child.visible = true;
                        if (layer === 'skeleton') child.visible = name.includes('bone') || name.includes('skeleton') || name.includes('skull');
                        if (layer === 'muscle') child.visible = !child.visible; // 可根据模型的节点命名规则自定义过滤
                    }
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isAutoRotating && humanModelGroup) {
                humanModelGroup.rotation.y += 0.004;
                meridianLinesGroup.rotation.y += 0.004;
            }
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function onCanvasClick(event) {
            const container = document.getElementById('canvas-container');
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(acupointMeshes);
            if (intersects.length > 0) {
                selectAcupoint(intersects[0].object.userData.pointId);
            }
        }

        function selectAcupoint(id) {
            const point = acupointsData.find(p => p.id === id);
            if (!point) return;
            selectedAcupoint = point;

            acupointMeshes.forEach(mesh => {
                if (mesh.userData.pointId === id) {
                    mesh.material.color.setHex(0xf59e0b);
                    mesh.scale.set(1.6, 1.6, 1.6);
                } else {
                    mesh.material.color.setHex(0x10b981);
                    mesh.scale.set(1, 1, 1);
                }
            });

            const targetPos = new THREE.Vector3(point.position.x, point.position.y, point.position.z);
            controls.target.copy(targetPos);
            const direction = camera.position.clone().sub(targetPos).normalize();
            camera.position.copy(targetPos).add(direction.multiplyScalar(2.1));

            switchTab('detail');
            renderDetailCard(point);

            if(window.innerWidth < 1024) document.getElementById('sidebar').classList.remove('translate-x-full');
        }

        function buildAcupointList() {
            const container = document.getElementById('acupoint-list-container');
            container.innerHTML = '';
            const filtered = acupointsData.filter(p => {
                return (currentFilter === 'ALL' || p.meridian === currentFilter) &&
                       (p.name.includes(currentSearchQuery) || p.code.toLowerCase().includes(currentSearchQuery.toLowerCase()));
            });

            document.getElementById('count-badge').textContent = filtered.length;

            filtered.forEach(point => {
                const card = document.createElement('div');
                card.className = 'p-3.5 rounded-xl bg-slate-950/60 border border-slate-800 hover:border-emerald-500/50 cursor-pointer transition flex items-center justify-between group';
                card.onclick = () => selectAcupoint(point.id);
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold group-hover:bg-emerald-500 group-hover:text-white transition">${point.name[0]}</div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h3 class="font-bold text-slate-200 group-hover:text-emerald-400 transition">${point.name}</h3>
                                <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">${point.code}</span>
                            </div>
                            <p class="text-xs text-slate-400 mt-0.5">${point.meridian}</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-600 group-hover:text-emerald-400 transition"></i>
                `;
                container.appendChild(card);
            });
        }

        function renderDetailCard(point) {
            document.getElementById('acupoint-detail-container').innerHTML = `
                <div class="bg-slate-950/85 border border-slate-800 rounded-2xl p-5 space-y-4">
                    <div class="flex items-start justify-between">
                        <div>
                            <span class="text-xs px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-400 font-semibold border border-emerald-500/30">${point.meridian}</span>
                            <h2 class="font-serif font-bold text-2xl text-white mt-2">${point.name} (${point.code})</h2>
                        </div>
                        <button onclick="switchTab('list')" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">返回</button>
                    </div>
                    <div class="space-y-3 pt-2 border-t border-slate-800 text-xs">
                        <p class="bg-slate-900/80 p-3 rounded-xl border border-slate-800"><b>定位：</b>${point.location}</p>
                        <p class="bg-slate-900/80 p-3 rounded-xl border border-slate-800"><b>解剖对照：</b>${point.anatomyInfo}</p>
                        <p class="bg-slate-900/80 p-3 rounded-xl border border-slate-800"><b>主治功效：</b>${point.indications}</p>
                    </div>
                    <button onclick="focusOnAcupoint('${point.id}')" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-lg transition">聚焦 3D 视角</button>
                </div>
            `;
        }

        function switchTab(tab) {
            document.getElementById('acupoint-list-container').classList.toggle('hidden', tab !== 'list');
            document.getElementById('acupoint-detail-container').classList.toggle('hidden', tab !== 'detail');
        }

        function filterByMeridian(meridian) {
            currentFilter = meridian;
            buildAcupointList();
        }

        function handleSearch(q) {
            currentSearchQuery = q.trim();
            buildAcupointList();
        }

        function toggleRotation() {
            isAutoRotating = !isAutoRotating;
            document.getElementById('rot-btn').classList.toggle('bg-emerald-600', isAutoRotating);
        }

        function toggleModelTransparency() {
            isTransparent = !isTransparent;
            if (loadedGlbModel) {
                loadedGlbModel.traverse(c => {
                    if (c.isMesh && c.material) {
                        c.material.transparent = true;
                        c.material.opacity = isTransparent ? 0.3 : 1.0;
                        c.material.needsUpdate = true;
                    }
                });
            }
        }

        function toggleMeridianLines() {
            showMeridianLines = !showMeridianLines;
            meridianLinesGroup.visible = showMeridianLines;
        }

        function resetCameraView(v) {
            isAutoRotating = false;
            controls.target.set(0, 0, 0);
            if (v === 'front') camera.position.set(0, 0.2, 5.8);
            if (v === 'back') camera.position.set(0, 0.2, -5.8);
            if (v === 'side') camera.position.set(5.8, 0.2, 0);
        }

        function focusOnAcupoint(id) { selectAcupoint(id); }
        function toggleMobileSidebar() { document.getElementById('sidebar').classList.toggle('translate-x-full'); }
    </script>
</body>
</html>
